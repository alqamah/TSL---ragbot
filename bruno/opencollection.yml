opencollection: 1.0.0

info:
  name: tsl-ragbot
  version: 1.0.0
  description: API test collection for TSL Industrial SOP RAG Assistant

bundled: true

extensions:
  bruno:
    ignore:
      - node_modules
      - .git

environments:
  - name: Local
    variables:
      - name: baseUrl
        value: http://localhost:8000
        enabled: true

items:
  # -------------------------------------------------------------
  # 1. System & Health Endpoints
  # -------------------------------------------------------------
  - info:
      name: 01 - Root Info
      type: http
      seq: 1
    http:
      method: GET
      url: "{{baseUrl}}/"
      headers:
        - name: Accept
          value: application/json

  - info:
      name: 02 - Health Check
      type: http
      seq: 2
    http:
      method: GET
      url: "{{baseUrl}}/health"
      headers:
        - name: Accept
          value: application/json

  - info:
      name: 03 - System & Vector DB Status
      type: http
      seq: 3
    http:
      method: GET
      url: "{{baseUrl}}/api/v1/status"
      headers:
        - name: Accept
          value: application/json

  # -------------------------------------------------------------
  # 2. RAG Query & Inference Endpoints (Multilingual)
  # -------------------------------------------------------------
  - info:
      name: 04 - Query RAG (English)
      type: http
      seq: 4
    http:
      method: POST
      url: "{{baseUrl}}/api/v1/query"
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
      body:
        type: json
        data: |-
          {
            "query": "What are the standard emergency shutdown procedures for blast furnace operations?",
            "top_k": 3,
            "show_sources": true
          }

  - info:
      name: 05 - Query RAG (Hindi)
      type: http
      seq: 5
    http:
      method: POST
      url: "{{baseUrl}}/api/v1/query"
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
      body:
        type: json
        data: |-
          {
            "query": "ब्लास्ट फर्नेस के आपातकालीन शटडाउन की प्रक्रिया क्या है?",
            "top_k": 3,
            "show_sources": true
          }

  - info:
      name: 06 - Query RAG (Hinglish)
      type: http
      seq: 6
    http:
      method: POST
      url: "{{baseUrl}}/api/v1/query"
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
      body:
        type: json
        data: |-
          {
            "query": "Emergency me boiler pressure alarm aane par kya action lena chahiye?",
            "top_k": 3,
            "show_sources": true
          }

  # -------------------------------------------------------------
  # 3. Document Ingestion Endpoints
  # -------------------------------------------------------------
  - info:
      name: 07 - Ingest Document by File Path
      type: http
      seq: 7
    http:
      method: POST
      url: "{{baseUrl}}/api/v1/ingest/file"
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
      body:
        type: json
        data: |-
          {
            "file_path": "d:/TSL/ragbot/io/SOP/01_test.XLSX"
          }

  - info:
      name: 08 - Ingest Upload (Multipart Form Data)
      type: http
      seq: 8
    http:
      method: POST
      url: "{{baseUrl}}/api/v1/ingest/upload"
      headers:
        - name: Accept
          value: application/json
      body:
        type: multipart-form
        data:
          - name: file
            type: file
            value: ""

  - info:
      name: 09 - Ingest Entire Directory
      type: http
      seq: 9
    http:
      method: POST
      url: "{{baseUrl}}/api/v1/ingest/directory"
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
      body:
        type: json
        data: |-
          {
            "directory_path": "d:/TSL/ragbot/io/SOP"
          }
