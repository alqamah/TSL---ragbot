services:
  # ---------------------------------------------------------------------------
  # FastAPI Backend Web Service (Cloud Vector DB Mode)
  # ---------------------------------------------------------------------------
  - type: web
    name: ragbot-backend
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python src/api/app.py --cloud --no-reload --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: QDRANT_MODE
        value: cloud
      - key: QDRANT_COLLECTION
        value: industrial_sops_v2
      - key: GEMINI_GENERATION_MODEL
        value: gemini-3.7-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # Streamlit Frontend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: ragbot-frontend
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r frontend/requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false --server.fileWatcherType none --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RAG_BACKEND_URL
        value: https://ragbot-backend-q5wj.onrender.com


